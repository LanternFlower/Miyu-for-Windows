[package]
name = "miyu-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Miyu 工具与引擎 层"

[dependencies]
miyu-base = { path = "../miyu-base" }
miyu-core = { path = "../miyu-core" }
anyhow = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
html2text = { workspace = true }
htmd = { workspace = true }
image = { workspace = true }
json_comments = { workspace = true }
markup5ever_rcdom = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
rodio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
trash = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
rustc-hash = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
pinyin = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }

[features]
# 测试夹具(各模块 test_support.rs)也编给上游 crate 的测试用
testkit = []
default = []
voice = ["dep:sherpa-onnx", "dep:cpal", "dep:pinyin", "dep:bzip2"]

[dev-dependencies]
miyu-base = { path = "../miyu-base", features = ["testkit"] }
miyu-core = { path = "../miyu-core", features = ["testkit"] }
