name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-python:
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the locked formatting toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo +1.96.1 fmt --check
      - name: Test packaging contracts
        run: python3 -m unittest discover -s packaging/ci/tests -v

  rust:
    needs: format-and-python
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        toolchain: ['1.96.1', '1.89.0']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native development libraries and test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config clang cmake ripgrep
      - name: Install the selected Rust toolchain
        env:
          RUST_VERSION: ${{ matrix.toolchain }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run isolated source unit tests
        if: matrix.toolchain == '1.96.1'
        run: python3 packaging/ci/run_tests.py --suite source-unit --report-dir out/ci/source-unit --timeout 3600
      - name: Check the declared MSRV without hiding failures
        if: matrix.toolchain == '1.89.0'
        shell: bash
        run: |
          mkdir -p out/ci
          cargo check --locked --all-targets 2>&1 | tee out/ci/msrv.log
      - name: Preserve check evidence in a mode-preserving archive
        if: always()
        run: |
          mkdir -p out/ci
          tar -czf rust-evidence.tar.gz -C out/ci .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-evidence-${{ matrix.toolchain }}
          path: rust-evidence.tar.gz
          compression-level: 0
          if-no-files-found: error
