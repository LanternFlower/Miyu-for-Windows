name: Generate packaging channel patches

on:
  workflow_dispatch:
    inputs:
      release-run-id:
        description: Successful Linux release workflow run containing verified-publish.
        type: number
        required: true
      published-url:
        description: Optional published release URL for channel metadata.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  patches:
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publish
          path: out/downloads
          run-id: ${{ inputs.release-run-id }}
          github-token: ${{ github.token }}
      - run: python3 packaging/ci/workflow.py unpack --archive out/downloads/verified-publish.tar.gz --out out/ci-release
      - name: Generate reviewable patches without pushing any channel repository
        env:
          PUBLISHED_URL: ${{ inputs.published-url }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/ci/workflow.py channels --root out/ci-release --out out/channel-patches --published-url "$PUBLISHED_URL"
      - name: Preserve patch file modes
        run: tar -czf channel-patches.tar.gz -C out/channel-patches .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-patches
          path: channel-patches.tar.gz
          compression-level: 0
          if-no-files-found: error
